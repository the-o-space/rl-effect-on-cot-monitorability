training:
  episodes: 1000
  learning_rate: 0.001

env:
  name: "CartPole-v1"

model:
  name: "PPO"
  policy: "MlpPolicy"
  path: "models/production/ppo_model.pt"

dataset:
  path: "datasets/production/cartpole_data.json"

runpod:
  name: "example.rl"
  image:
  template: https://console.runpod.io/hub/template/runpod-pytorch-2-1?id=runpod-torch-v21